<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oefeningen · Pienter 2 · Leerjaar 2 · H11</title><style>:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2440;--muted:#5b6478;--accent:#2f5bff;--accent2:#5b3df0;
      --accent-soft:#e8eeff;--border:#e2e7f0;--good:#1a9d5c;--good-soft:#e5f7ee;--bad:#d63b3b;--bad-soft:#fdecec}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
     background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 80px}
header{color:#fff;border-radius:18px;padding:28px 28px 24px;margin-bottom:22px;box-shadow:0 10px 30px rgba(47,91,255,.25)}
header.grad{background:linear-gradient(135deg,#2f5bff 0%,#5b3df0 100%)}
header h1{margin:0 0 6px;font-size:1.7rem;letter-spacing:-.02em}
header p{margin:0;opacity:.93;font-size:.97rem}
header .crumb{margin:0;opacity:.85;font-size:.85rem;font-weight:600}
header .crumb a{color:#fff;text-decoration:none}
a.link{display:inline-block;margin:8px 8px 0 0;border-radius:999px;padding:6px 14px;font-size:.83rem;font-weight:700;text-decoration:none}
a.link.solid{background:var(--card);color:var(--accent);border:1px solid var(--border)}
.sticky{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.9);backdrop-filter:blur(8px);padding:10px 16px;margin:0 -16px 6px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.scorebox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 16px;font-weight:700;display:flex;align-items:center;gap:10px}
.scorebox .n{font-size:1.5rem;color:var(--accent)}
button{cursor:pointer;border:0;border-radius:12px;font-size:.95rem;font-weight:600;padding:11px 20px}
.btn-check{background:var(--accent);color:#fff}
.btn-reset{background:var(--card);color:var(--muted);border:1px solid var(--border)}
.progress{flex:1;min-width:170px}.progress .track{height:8px;background:var(--border);border-radius:999px;overflow:hidden}
.progress .fill{height:100%;width:0%;background:var(--accent);transition:width .2s}.progress .lbl{font-size:.78rem;color:var(--muted);margin-top:4px}
h3.sub{margin:26px 0 8px;font-size:1.05rem;color:var(--accent)}
.formula{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:9px;padding:10px 14px;margin:12px 0;font-size:.98rem}
.figgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin:12px 0}
.figbox{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px}
.figcap{font-size:.8rem;color:var(--muted);text-align:center;margin-top:6px}
.ex{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;margin:12px 0}
.ex .extitle{font-weight:800;color:var(--accent);font-size:1rem;margin:0 0 6px}
.ex .steps{margin:6px 0 8px;padding-left:18px}
.ex .steps li{margin:3px 0}
.ex .uit{background:var(--good-soft);border-radius:8px;padding:7px 10px;font-weight:700;color:var(--good)}
.block{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin:12px 0}
.lees{background:#f2fdf5;border-left:4px solid var(--good);border-radius:9px;padding:10px 14px;margin:10px 0;font-size:.92rem}
.lees code{background:#e3f6ea;border-color:#c2e6d2;color:#14603a}
.lees .pdfopen{display:inline-block;margin-top:8px;border-radius:999px;padding:5px 14px;font-size:.84rem;font-weight:700;text-decoration:none;background:var(--good);color:#fff}
.lees a.subpage{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:#b9c6f0;background:transparent}
.lees a.subpage:hover{color:var(--accent2);text-decoration:underline;text-decoration-color:var(--accent2)}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:.93rem}
th,td{border:1px solid var(--border);padding:8px 11px;text-align:left}th{background:var(--bg)}
code{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace}
ul.res li{margin:4px 0}
ul.res a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:#b9c6f0;word-break:break-word}
ul.res a:hover{color:var(--accent2);text-decoration-color:var(--accent2)}
.q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin:10px 0}
.q .qnum{font-weight:800;color:var(--accent);font-size:.8rem;letter-spacing:.04em}
.q .qtext{margin:6px 0 12px;font-size:1.02rem;font-weight:600}
.opts{display:grid;gap:8px}
label.opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;cursor:pointer;transition:.12s}
label.opt:hover{background:var(--accent-soft);border-color:#c8d6ff}
label.opt input{position:absolute;opacity:0;width:0;height:0}
label.opt .key{font-weight:800;color:var(--muted);background:var(--bg);border-radius:7px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;flex:none}
label.opt .txt{flex:1}
label.opt.sel{border-color:var(--accent);background:var(--accent-soft)}label.opt.sel .key{background:var(--accent);color:#fff}
.q.correct{border-color:var(--good);background:var(--good-soft)}.q.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q.correct label.opt.right,.q.wrong label.opt.right{border-color:var(--good);background:#d7f2e4}
.q.wrong label.opt.mychoice{border-color:var(--bad);background:#f7d7d7}
label.opt.right .key{background:var(--good);color:#fff}label.opt.mychoice .key{background:var(--bad);color:#fff}
.exp{display:none;margin-top:10px;font-size:.9rem;background:var(--bg);border-radius:9px;padding:9px 12px}.exp.show{display:block}
.exp b{color:var(--accent)}.verdict{font-weight:700;font-size:.85rem;margin-top:6px}
.oef{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin:12px 0}
.oef-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.oef-n{font-weight:800;color:var(--accent);font-size:.8rem;letter-spacing:.04em}
.oef-lv{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px}
.oef-lv.lv1{background:var(--good-soft);color:var(--good)}
.oef-lv.lv2{background:var(--accent-soft);color:var(--accent)}
.oef-lv.lv3{background:var(--bad-soft);color:var(--bad)}
.oef-vraag{margin:0 0 10px;font-weight:600;font-size:1.02rem}
.uit{margin-top:8px;color:var(--ink)}
.btn-togg{cursor:pointer;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;font-family:inherit}
.btn-togg:hover{background:var(--accent);color:#fff}
.q.correct .verdict{color:var(--good)}.q.wrong .verdict{color:var(--bad)}
#summary{display:none;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:24px}
.big{font-size:2.4rem;font-weight:800;color:var(--accent)}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:12px}
.chcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-decoration:none;color:inherit;display:block;transition:.12s}
.chcard:hover{border-color:var(--accent);box-shadow:0 8px 20px rgba(47,91,255,.14);transform:translateY(-2px)}
.chcard h4{margin:0 0 4px;font-size:1.02rem}.chcard p{margin:0;color:var(--muted);font-size:.85rem}
.chcard.soon{opacity:.62}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.72rem;font-weight:700;margin-top:8px}
.chip.ok{background:#e5f7ee;color:var(--good)}.chip.wip{background:#e6e9f1;color:var(--muted)}
@media(max-width:560px){header h1{font-size:1.35rem}}</style></head><body>
<div class="wrap">
<header style="background:linear-gradient(135deg,#5b3df0 0%,#5b3df0 100%)">
  <p class="crumb"><a href="index.html">← Wiskunde</a> · P2 · H11 — Machten (gehele exponent)</p>
  <h1>Oefeningen — H11 — Machten (gehele exponent)</h1>
  <p>Probeer eerst zelf (papier/klad). Daarna klik je op <b>🔎 Toon antwoord</b> om te controleren. Deze pagina combineert open sommen en meerkeuze.</p>
</header>
<div id="oef"></div>
<p style="margin-top:22px"><a class="link solid" href="pP2-H11-machten-gehele-exponent-theorie.html">📖 Terug naar de theorie</a> &nbsp; <a class="link" href="pP2-H11-machten-gehele-exponent-toets.html">📝 Naar de toets →</a></p>
</div>
<script>
const OEF=[{"type": "open", "lv": 1, "vraag": "Bereken: 5⁰", "antwoord": "1", "uit": "Elk getal (verschillend van 0) tot de macht 0 is gelijk aan 1. Dus 5⁰ = 1."}, {"type": "open", "lv": 1, "vraag": "Bereken: 2⁻³ (schrijf als breuk)", "antwoord": "1/8", "uit": "Een negatieve exponent geeft het omgekeerde: 2⁻³ = 1/2³ = 1/8."}, {"type": "open", "lv": 2, "vraag": "Bereken: 3² · 3⁴ (schrijf als macht en reken uit)", "antwoord": "3⁶ = 729", "uit": "Bij machten met hetzelfde grondtal tel je de exponenten op: 3² · 3⁴ = 3²⁺⁴ = 3⁶ = 729."}, {"type": "open", "lv": 2, "vraag": "Bereken: 5⁶ ÷ 5⁴ (schrijf als macht en reken uit)", "antwoord": "5² = 25", "uit": "Bij machten met hetzelfde grondtal trek je de exponenten af: 5⁶ ÷ 5⁴ = 5⁶⁻⁴ = 5² = 25."}, {"type": "open", "lv": 2, "vraag": "Bereken: (2³)² (schrijf als macht en reken uit)", "antwoord": "2⁶ = 64", "uit": "Bij een macht van een macht vermenigvuldig je de exponenten: (2³)² = 2³×² = 2⁶ = 64."}, {"type": "open", "lv": 2, "vraag": "Schrijf 0,0042 in wetenschappelijke notatie.", "antwoord": "4,2 · 10⁻³", "uit": "Je zet de komma zodat er één cijfer (ongelijk aan 0) voor staat: 4,2. De komma verschuift 3 plaatsen naar rechts, dus de exponent is −3: 4,2 · 10⁻³."}, {"type": "open", "lv": 3, "vraag": "Een blad papier is 1,2 · 10⁻⁴ m dik. Schrijf dat als gewoon getal (in meter).", "antwoord": "0,00012 m", "uit": "10⁻⁴ = 0,0001. Dus 1,2 · 10⁻⁴ = 1,2 × 0,0001 = 0,00012. Het blad is 0,00012 m dik."}, {"type": "mc", "lv": 1, "vraag": "Hoeveel is 7⁰?", "opties": ["0", "1", "7", "onbepaald"], "goed": 1, "uit": "Elk getal (verschillend van 0) tot de macht 0 is 1, dus 7⁰ = 1."}, {"type": "mc", "lv": 2, "vraag": "Hoeveel is 5⁻²?", "opties": ["−25", "1/25", "−10", "1/10"], "goed": 1, "uit": "Een negatieve exponent geeft het omgekeerde: 5⁻² = 1/5² = 1/25."}, {"type": "mc", "lv": 3, "vraag": "Wat is het verschil tussen (−3)² en −3²?", "opties": ["Ze zijn allebei 9.", "(−3)² = 9 en −3² = −9", "Allebei −9.", "(−3)² = −9 en −3² = 9"], "goed": 1, "uit": "(−3)² = (−3) · (−3) = 9, maar −3² betekent −(3 · 3) = −9. De haakjes maken een groot verschil!"}];const lvTxt=["","Warm-up","Midden","Uitdagend"];const letters=["A","B","C","D"];
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
const wrap=document.getElementById("oef");
OEF.forEach((O,oi)=>{const card=el("div","oef");card.dataset.i=oi;
 const head=el("div","oef-head");head.appendChild(el("span","oef-n","OEFENING "+(oi+1)));
 if(O.lv)head.appendChild(el("span","oef-lv lv"+O.lv,lvTxt[O.lv]||""));
 card.appendChild(head);
 card.appendChild(el("div","oef-vraag",O.vraag));
 if(O.type==="mc"){const opts=el("div","opts");O.opties.forEach((o,oi2)=>{const label=el("label","opt");const inp=document.createElement("input");inp.type="radio";inp.name="oef"+oi;inp.value=oi2;label.appendChild(inp);label.appendChild(el("span","key",letters[oi2]||""));label.appendChild(el("span","txt",o));opts.appendChild(label);});card.appendChild(opts);}
 const btn=el("button","btn-togg","🔎 Toon antwoord");
 const sol=el("div","exp");
 if(O.type==="mc"){sol.appendChild(el("b","","Juist antwoord: "));sol.appendChild(el("span","",O.opties[O.goed]));}
 else{sol.appendChild(el("b","","Antwoord: "));sol.appendChild(el("span","",O.antwoord));}
 if(O.uit){const u=el("div","uit");u.appendChild(el("b","","Uitwerking: "));u.appendChild(document.createTextNode(O.uit));sol.appendChild(u);}
 btn.addEventListener("click",()=>{sol.classList.add("show");btn.style.display="none";});
 card.appendChild(btn);card.appendChild(sol);wrap.appendChild(card);});
if(OEF.length===0){wrap.appendChild(el("div","block","De oefeningen bij dit hoofdstuk verschijnen binnenkort."));}
</script></body></html>
