<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instapcheck Wiskunde · Yanin</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1b2440;--muted:#5b6478;--accent:#2f5bff;
        --accent2:#5b3df0;--accent-soft:#e8eeff;--border:#e2e7f0;--good:#1a9d5c;
        --good-soft:#e5f7ee;--bad:#d63b3b;--bad-soft:#fdecec;--warn:#eab308}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px}
  header{background:linear-gradient(135deg,#2f5bff 0%,#5b3df0 100%);color:#fff;border-radius:18px;
         padding:28px 28px 24px;margin-bottom:20px;box-shadow:0 10px 30px rgba(47,91,255,.25)}
  header h1{margin:0 0 6px;font-size:1.7rem;letter-spacing:-.02em}
  header p{margin:0;opacity:.93;font-size:.97rem}
  header .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.85rem;opacity:.95}
  header .meta span{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px}
  .sticky{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.9);backdrop-filter:blur(8px);
          padding:10px 16px;margin:0 -16px 6px}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .scorebox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 16px;
            font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:10px}
  .scorebox .n{font-size:1.45rem;color:var(--accent)}
  button{cursor:pointer;border:0;border-radius:12px;font-size:.95rem;font-weight:600;padding:11px 20px}
  .btn-check{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(47,91,255,.35)}
  .btn-reset{background:var(--card);color:var(--muted);border:1px solid var(--border)}
  .progress{flex:1;min-width:170px}
  .progress .track{height:8px;background:var(--border);border-radius:999px;overflow:hidden}
  .progress .fill{height:100%;width:0%;background:var(--accent);transition:width .2s}
  .progress .lbl{font-size:.78rem;color:var(--muted);margin-top:4px}
  .deel{margin-top:30px}
  .deelhead{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--accent-soft)}
  .deelhead h2{margin:0;font-size:1.12rem;color:var(--accent)}
  .deelhead .intro{font-size:.85rem;color:var(--muted)}
  .q{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin:10px 0;
     display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .q .qnum{font-weight:800;color:var(--accent);font-size:.8rem;letter-spacing:.03em;min-width:24px}
  .q .qtext{flex:1;min-width:200px;font-size:1rem;font-weight:600}
  .q .inwrap{display:flex;align-items:center;gap:8px}
  .q input{width:130px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;
           text-align:center;font-family:inherit;background:#fff;transition:border-color .12s}
  .q input:focus{outline:none;border-color:var(--accent)}
  .q .unit{font-size:.9rem;color:var(--muted);font-weight:600}
  .q.ok{border-color:var(--good);background:var(--good-soft)}
  .q.ok input{border-color:var(--good);background:#fff}
  .q.bad{border-color:var(--bad);background:var(--bad-soft)}
  .q.bad input{border-color:var(--bad);background:#fff}
  .verdict{width:100%;margin-top:4px;font-size:.85rem;font-weight:700}
  .q.ok .verdict{color:var(--good)} .q.bad .verdict{color:var(--bad)}
  .verdict .right{color:var(--muted);font-weight:600}
  #summary{display:none;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-top:26px}
  .big{font-size:2.4rem;font-weight:800;color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:16px}
  .box{background:var(--bg);border-radius:11px;padding:11px 13px;font-size:.86rem;border:1px solid var(--border)}
  .box .t{font-weight:700;margin-bottom:2px}
  .box .s{color:var(--muted)}
  .box.warn{border-color:#f3d38b;background:#fff8e6}
  .box.okbox{border-color:#c6e8d4;background:#effaf3}
  .box .tag{display:inline-block;margin-top:6px;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:700}
  .tag.tgood{background:var(--good-soft);color:var(--good)}
  .tag.twarn{background:#fdf0cf;color:#986c00}
  @media(max-width:560px){header h1{font-size:1.3rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Instapcheck Wiskunde — Yanin</h1>
    <p>Vul je antwoord in en klik op "Controleer". Dit is een nulmeting, geen toets: fouten zijn ok.</p>
    <div class="meta"><span>⏱ ± 30–40 min</span><span>🚫 geen rekenmachine</span><span>📚 Wiskunde · 1e graad A-stroom</span></div>
  </header>

  <div class="sticky">
    <div class="bar">
      <button class="btn-check" id="btnCheck">✓ Controleer mijn antwoorden</button>
      <button class="btn-reset" id="btnReset">Opnieuw</button>
      <div class="scorebox">Score <span class="n" id="liveN">0</span>/<span id="tot">0</span></div>
      <div class="progress"><div class="track"><div class="fill" id="fill"></div></div>
        <div class="lbl" id="progLbl">0 beantwoord</div></div>
    </div>
  </div>

  <div id="quiz"></div>

  <div id="summary">
    <h2>Resultaat</h2>
    <div id="feedback"></div>
    <div class="big" id="bigScore"></div>
    <h3 style="margin:18px 0 4px;color:var(--accent)">Per deel</h3>
    <div class="grid" id="deelGrid"></div>
    <h3 style="margin:20px 0 4px;color:var(--accent)">Wat dit betekent (basisschaven week 1–2)</h3>
    <div id="advice"></div>
  </div>
</div>

<script>
const QUESTIONS = [{"deel": 0, "titel": "Deel 1 · Tafels & hoofdbewerkingen", "q": "7 × 8", "accept": ["56"], "unit": null}, {"deel": 0, "titel": "Deel 1 · Tafels & hoofdbewerkingen", "q": "9 × 6", "accept": ["54"], "unit": null}, {"deel": 0, "titel": "Deel 1 · Tafels & hoofdbewerkingen", "q": "12 × 4", "accept": ["48"], "unit": null}, {"deel": 0, "titel": "Deel 1 · Tafels & hoofdbewerkingen", "q": "56 : 7", "accept": ["8"], "unit": null}, {"deel": 0, "titel": "Deel 1 · Tafels & hoofdbewerkingen", "q": "72 : 8", "accept": ["9"], "unit": null}, {"deel": 0, "titel": "Deel 1 · Tafels & hoofdbewerkingen", "q": "15 × 6", "accept": ["90"], "unit": null}, {"deel": 1, "titel": "Deel 2 · Volgorde van bewerkingen & haakjes", "q": "3 + 4 × 2", "accept": ["11"], "unit": null}, {"deel": 1, "titel": "Deel 2 · Volgorde van bewerkingen & haakjes", "q": "(3 + 4) × 2", "accept": ["14"], "unit": null}, {"deel": 1, "titel": "Deel 2 · Volgorde van bewerkingen & haakjes", "q": "12 − 6 : 2", "accept": ["9"], "unit": null}, {"deel": 1, "titel": "Deel 2 · Volgorde van bewerkingen & haakjes", "q": "20 : 4 + 1", "accept": ["6"], "unit": null}, {"deel": 1, "titel": "Deel 2 · Volgorde van bewerkingen & haakjes", "q": "2 × (5 + 3) − 4", "accept": ["12"], "unit": null}, {"deel": 1, "titel": "Deel 2 · Volgorde van bewerkingen & haakjes", "q": "10 − 2 × 3 + 1", "accept": ["5"], "unit": null}, {"deel": 2, "titel": "Deel 3 · Breuken", "q": "Vereenvoudig: 12/18", "accept": ["2/3", "0,6667", "0.6667", "0,67", "0.67"], "unit": null}, {"deel": 2, "titel": "Deel 3 · Breuken", "q": "Vereenvoudig: 20/25", "accept": ["4/5", "0,8", "0.8"], "unit": null}, {"deel": 2, "titel": "Deel 3 · Breuken", "q": "1/4 + 1/6", "accept": ["5/12", "0,4167", "0.4167"], "unit": null}, {"deel": 2, "titel": "Deel 3 · Breuken", "q": "2/3 × 9/10", "accept": ["3/5", "0,6", "0.6"], "unit": null}, {"deel": 2, "titel": "Deel 3 · Breuken", "q": "3/4 : 1/2", "accept": ["3/2", "1,5", "1.5"], "unit": null}, {"deel": 3, "titel": "Deel 4 · Decimale getallen", "q": "0,5 + 0,25", "accept": ["0,75", "0.75"], "unit": null}, {"deel": 3, "titel": "Deel 4 · Decimale getallen", "q": "3,6 × 10", "accept": ["36"], "unit": null}, {"deel": 3, "titel": "Deel 4 · Decimale getallen", "q": "7,8 : 2", "accept": ["3,9", "3.9"], "unit": null}, {"deel": 3, "titel": "Deel 4 · Decimale getallen", "q": "Rond af op 1 decimaal: 3,456", "accept": ["3,5", "3.5"], "unit": null}, {"deel": 3, "titel": "Deel 4 · Decimale getallen", "q": "0,3 × 0,2", "accept": ["0,06", "0.06"], "unit": null}, {"deel": 4, "titel": "Deel 5 · Eenheden", "q": "1 km = ... m", "accept": ["1000"], "unit": "m"}, {"deel": 4, "titel": "Deel 5 · Eenheden", "q": "1 m² = ... cm²", "accept": ["10000", "10 000"], "unit": "cm²"}, {"deel": 4, "titel": "Deel 5 · Eenheden", "q": "1 L = ... ml", "accept": ["1000"], "unit": "ml"}, {"deel": 4, "titel": "Deel 5 · Eenheden", "q": "1 m³ = ... L", "accept": ["1000"], "unit": "L"}, {"deel": 4, "titel": "Deel 5 · Eenheden", "q": "3,5 m = ... cm", "accept": ["350"], "unit": "cm"}, {"deel": 5, "titel": "Deel 6 · Omtrek & oppervlakte", "q": "Rechthoek: omtrek", "accept": ["20"], "unit": "cm"}, {"deel": 5, "titel": "Deel 6 · Omtrek & oppervlakte", "q": "Rechthoek: oppervlakte", "accept": ["24"], "unit": "cm²"}, {"deel": 5, "titel": "Deel 6 · Omtrek & oppervlakte", "q": "Vierkant: omtrek", "accept": ["20"], "unit": "cm"}, {"deel": 5, "titel": "Deel 6 · Omtrek & oppervlakte", "q": "Vierkant: oppervlakte", "accept": ["25"], "unit": "cm²"}, {"deel": 6, "titel": "Deel 7 · Procenten", "q": "25% van 80", "accept": ["20"], "unit": null}, {"deel": 6, "titel": "Deel 7 · Procenten", "q": "10% van 150", "accept": ["15"], "unit": null}, {"deel": 6, "titel": "Deel 7 · Procenten", "q": "Jas van € 40 − 20% korting → nieuwe prijs", "accept": ["32"], "unit": "€"}];
const DEELINFO = [{"titel": "Deel 1 · Tafels & hoofdbewerkingen", "intro": "Uit het hoofd — schrijf enkel het antwoord.", "opmerk": "Tafels op tempo trainen (5 min/dag)."}, {"titel": "Deel 2 · Volgorde van bewerkingen & haakjes", "intro": "Let op de volgorde: haakjes → × en : → + en −.", "opmerk": "Volgorde bewerkingen + haakjes (BODMAS)."}, {"titel": "Deel 3 · Breuken", "intro": "Vereenvoudig of reken uit. (je mag ook een kommagetal geven)", "opmerk": "Gelijknamig maken, vereenvoudigen, × en : van breuken."}, {"titel": "Deel 4 · Decimale getallen", "intro": "Kommagetallen. Schrijf het resultaat met komma.", "opmerk": "Kommagetallen + ×10/÷ en afronden."}, {"titel": "Deel 5 · Eenheden", "intro": "Vul de juiste eenheid aan; het getal volstaat ook.", "opmerk": "Omrekenen lengte/oppervlakte/inhoud."}, {"titel": "Deel 6 · Omtrek & oppervlakte", "intro": "Rechthoek (lengte 6 cm, breedte 4 cm) en vierkant (zijde 5 cm).", "opmerk": "Formules rechthoek/vierkant + verschil omtrek/oppervlakte."}, {"titel": "Deel 7 · Procenten", "intro": "Bereken het procent/de korting.", "opmerk": "p% van een bedrag, korting berekenen."}];
const TOTAL = QUESTIONS.length;
document.getElementById("tot").textContent = TOTAL;

// ---- normalisatie & tolerant vergelijken ---------------------------------
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
function fmt(x){return (Math.round((x+Number.EPSILON)*10000)/10000).toString();}
function norm(s){
  s=String(s==null?'':s).toLowerCase().trim();
  s=s.replace(/\s+/g,'').replace(',', '.');            // spaties weg, komma→punt
  s=s.replace(/(km|m2|cm2|m³|cm³|ml|l|m|cm|mm|kg|g|€|eur)$/i,'');  // eenheid afknippen
  return s.trim();
}
function variants(a){
  const out=new Set(); let n=norm(a); if(!n)return out; out.add(n);
  if(/^\d+\/\d+$/.test(n)){
    let p=n.split('/').map(Number); let g=gcd(p[0],p[1]);
    out.add((p[0]/g)+'/'+(p[1]/g)); out.add(fmt(p[0]/p[1]));
  } else if(/^\d+(\.\d+)?$/.test(n)){ out.add(fmt(parseFloat(n))); }
  return out;
}
function acceptedSet(list){ const s=new Set(); list.forEach(a=>variants(a).forEach(v=>s.add(v))); return s; }
function isCorrect(user, accept){ return Array.from(variants(user)).some(v=>acceptedSet(accept).has(v)); }

// ---- render --------------------------------------------------------------
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
const quiz=document.getElementById("quiz");
let curDeel=-1; const qInDeel={};
QUESTIONS.forEach((Q,qi)=>{
  if(Q.deel!==curDeel){curDeel=Q.deel;qInDeel[curDeel]=0;const d=el("div","deel",Q.titel);
    d.appendChild(el("div","intro",DEELINFO[curDeel].intro));quiz.appendChild(d);}
  qInDeel[curDeel]=(qInDeel[curDeel]||0)+1;
  const box=el("div","q");
  box.appendChild(el("div","qnum",(curDeel+1)+"."+qInDeel[curDeel]));
  box.appendChild(el("div","qtext",Q.q));
  const inwrap=el("div","inwrap");
  const inp=document.createElement("input");inp.type="text";inp.inputMode="text";inp.autocomplete="off";
  inp.addEventListener("input",updateProgress);
  inwrap.appendChild(inp);
  if(Q.unit){inwrap.appendChild(el("span","unit",Q.unit));}
  box.appendChild(inwrap);
  quiz.appendChild(box);
  Q._box=box; Q._inp=inp;
});

// ---- progressie ----------------------------------------------------------
function updateProgress(){
  let d=0; QUESTIONS.forEach(Q=>{if(Q._inp && Q._inp.value.trim()!=='')d++;});
  document.getElementById("liveN").textContent=d;
  document.getElementById("fill").style.width=(d/TOTAL*100)+"%";
  document.getElementById("progLbl").textContent=d+" van "+TOTAL+" beantwoord";
}

document.getElementById("btnCheck").addEventListener("click",()=>{
  let score=0; const perDeel={};
  QUESTIONS.forEach((Q,qi)=>{
    const inp=Q._inp; const box=Q._box;
    const user=inp.value; const okv=isCorrect(user, Q.accept);
    const verdict=el("div","verdict");
    box.classList.remove("ok","bad");
    if(okv){box.classList.add("ok");verdict.textContent="✓ Juist!";score++;var myok=true;}
    else{box.classList.add("bad");
         verdict.textContent="✗ Fout";
         verdict.appendChild(document.createTextNode(" · juist: "));
         const rs=el("span","right",Q.accept[0]);verdict.appendChild(rs);}
    if(user.trim()===''){verdict.textContent="✗ Niet beantwoord → juist: "+Q.accept[0];}
    box.querySelector('.inwrap').after(verdict);
    inp.disabled=true; inp.style.background='#fff';
    const k=DEELINFO[Q.deel].titel; if(!perDeel[k])perDeel[k]={n:0,ok:0}; perDeel[k].n++; if(okv)perDeel[k].ok++;
  });
  // einde
  document.getElementById("bigScore").textContent=score+"/"+TOTAL+" ("+Math.round(score/TOTAL*100)+"%)";
  const pct=Math.round(score/TOTAL*100);
  document.getElementById("feedback").textContent=(pct>=85?"Uitstekend — de basis is sterk! 🎉":
      pct>=70?"Goed gedaan 💪":"Mooie nulmeting — de basisschaven-weken (1–2) worden nu gevuld met wat nodig is.");
  // per deel grid
  const grid=document.getElementById("deelGrid"); grid.innerHTML="";
  let anyWarn=false;
  DEELINFO.forEach((info,ti)=>{
    const box=el("div","box");
    const st=perDeel[info.titel]||{n:0,ok:0};
    const wrong=st.n-st.ok;
    const warn=wrong>=2 || (wrong>=Math.ceil(st.n/3) && wrong>0);
    if(warn)anyWarn=true;
    box.classList.add(warn?"warn":"okbox");
    box.appendChild(el("div","t",info.titel));
    box.appendChild(el("div","s",st.ok+" / "+st.n+" juist"));
    const tag=el("span","tag "+(warn?"twarn":"tgood"),warn?"→ week 1–2 extra oefenen":"✅ ok");
    box.appendChild(tag);grid.appendChild(box);
  });
  // advies
  const adv=document.getElementById("advice"); adv.innerHTML="";
  if(anyWarn){
    adv.appendChild(el("p","","Deze onderdelen plan je uitdrukkelijk in de basisschaven-weken (week 1–2 van de planning):"));
    const ul=el("ul"); 
    DEELINFO.forEach(info=>{
      const st=perDeel[info.titel]||{n:0,ok:0}; const wrong=st.n-st.ok;
      if(wrong>=2 || (wrong>=Math.ceil(st.n/3)&&wrong>0)){
        const li=el("li","",info.titel+" — "+info.opmerk);ul.appendChild(li);
      }
    });
    adv.appendChild(ul);
    adv.appendChild(el("p","","Als alle onderdelen goed zijn (≤1 fout per deel) mag je de 2 basisschaven-weken inkorten en sneller naar Blok A (getallen). Zie de [[Lesplanning]]. Dit is vakpagina Wiskunde; andere vakken krijgen hun eigen pagina."));
  } else {
    adv.appendChild(el("p","","Sterke basis! De 2 basisschaven-weken mag je inkorten tot 1 week en dan start je sneller met Blok A (getallenleer)."));
  }
  const sum=document.getElementById("summary");sum.style.display="block";sum.scrollIntoView({behavior:"smooth",block:"start"});
});

document.getElementById("btnReset").addEventListener("click",()=>location.reload());
updateProgress();
</script>
</body>
</html>
